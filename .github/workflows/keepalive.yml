name: Keepalive Render Backend

on:
  schedule:
    # Runs every 10 minutes to keep Render web service awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API Endpoint
        run: |
          curl -s -f https://prem-mobile-api.onrender.com/api/health || echo "Ping attempted"
